[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sales_analytics_orchestration"
version = "0.1.0"
dependencies = [
    "dagster==1.12.12",
    "dagster-webserver==1.12.12",
    "dagster-duckdb==0.29.*",
    "sqlmesh[duckdb]==0.228.*",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[tool.setuptools.packages.find]
where = [".."]
include = ["orchestration*", "shared*"]

[tool.dagster]
module = "orchestration.definitions"
code_location_name = "sales_analytics"