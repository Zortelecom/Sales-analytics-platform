# .streamlit/secrets.example.toml
#
# Copy to .streamlit/secrets.toml and edit. NEVER commit secrets.toml.
# Add to .gitignore:
#     .streamlit/secrets.toml
#
# Generate a password hash:
#     python -m reporting.auth.passwords --pepper "<the pepper below>"
#
# Streamlit reloads this file on change, so you can add a colleague without
# restarting the server.

[auth]
# Mixed into every password hash. Changing it invalidates all existing hashes.
# Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
pepper = "bigzed"

session_timeout_minutes = 480      # re-login after 8 h
max_failed_attempts    = 5         # per email, across all sessions
lockout_minutes        = 10


# ---------------------------------------------------------------------------
