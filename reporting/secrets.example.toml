# WHY subregions AND NOT supervisors FOR SUPERVISORS
# --------------------------------------------------
# `subregion` is present on every view the app reads and on the whole KP-SD
# sell-in chain. `supervisor_name` is missing from v_regional_kpi,
# v_product_kpi, v_innovation_kpi and v_client_kpi, so a supervisors-scoped
# user gets a fail-closed refusal on pages that a subregions-scoped user reads
# fine. Add `supervisors` on top of `subregions` only when one subregion has
# two supervisors you need to keep apart -- and apply bi_views_rls_patch.sql
# first so the KP-SD views carry supervisor_name.
#
# Other keys:
#   can_ask_data = true|false   access to the free-form SQL page
#   can_export   = true|false   CSV download buttons
#   pages        = ["executive", "regional"]   restrict the nav; omit for all
#                  valid keys: executive, regional, salesforce, product,
#                              time, quality, ask, sellin

# The password below is "demo-password-change-me" hashed with the pepper above.
# Replace both before anyone else can reach the machine.

