# .streamlit/secrets.example.toml
#
# Copy to .streamlit/secrets.toml and edit. NEVER commit secrets.toml.
#     echo '.streamlit/secrets.toml' >> .gitignore
#
# Generate a password hash:
#     python -m reporting.auth.passwords --pepper "<the pepper below>"
#
# Streamlit reloads this file on change, so you can add a colleague without
# restarting the server.

[auth]
# Mixed into every password hash. Changing it invalidates all existing hashes.
# Generate one with: python -c "import secrets; print(secrets.token_urlsafe(32))"
pepper = "replace-this-with-a-long-random-string"

session_timeout_minutes = 480      # re-login after 8 h
max_failed_attempts    = 5         # per email, across all sessions
lockout_minutes        = 10


# ---------------------------------------------------------------------------
# Roles
# ---------------------------------------------------------------------------
#   admin       report owner / data analyst. Unrestricted, free-form SQL.
#               Scope keys on an admin record are REJECTED at load time.
#   analyst     same visibility, no scope keys expected. Free-form SQL.
#   rbm         Regional Business Manager. All regions by default -- add
#               `regions = [...]` only if you split the role per region.
#   supervisor  scope with `subregions`.
#   viewer      most restrictive fallback.
#
# Scope keys (all optional). OMITTING a key = UNRESTRICTED on that dimension.
# An EMPTY LIST = sees nothing. The two are deliberately different.
#
#   subregions   = ["Douala Nord"]   <- the supervisor boundary. Use this one.
#   regions      = ["Littoral"]
#   supervisors  = ["NGONO A."]      <- dim_salesperson.supervisor_name
#   salespersons = ["SP-014"]        <- rarely needed; reps aren't report users
#   channels     = ["DG"]
#   clients      = ["SD-003"]        <- clientsd_id
#
# WHY subregions AND NOT supervisors FOR SUPERVISORS
# --------------------------------------------------
# `subregion` is present on every view the app reads and on the whole KP-SD
# sell-in chain. `supervisor_name` is missing from v_regional_kpi,
# v_product_kpi, v_innovation_kpi and v_client_kpi, so a supervisors-scoped
# user gets a fail-closed refusal on pages that a subregions-scoped user reads
# fine. Add `supervisors` on top of `subregions` only when one subregion has
# two supervisors you need to keep apart -- and apply bi_views_rls_patch.sql
# first so the KP-SD views carry supervisor_name.
#
# Other keys:
#   can_ask_data = true|false   access to the free-form SQL page
#   can_export   = true|false   CSV download buttons
#   pages        = ["executive", "regional"]   restrict the nav; omit for all
#                  keys: executive, regional, salesforce, product, time,
#                        quality, ask, sellin


