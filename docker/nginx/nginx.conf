# nginx.conf — Production reverse proxy
#
# Port map:
#   :80   → HTTP → HTTPS redirect
#   :443  → Streamlit dashboards (main entry point for all users)
#   :3443 → Dagster UI (engineers only, protected by BasicAuth)
#   :8443 → Apache Superset (BI users, protected by Superset's own auth)
#
# TLS: mkcert for local / Let's Encrypt for remote hostname
# Certs mounted at /etc/nginx/certs/ (gitignored)
# BasicAuth htpasswd at /etc/nginx/.htpasswd (gitignored)
#
# Generate BasicAuth credentials:
#   htpasswd -c docker/nginx/.htpasswd dagster-admin

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Structured access log
    log_format json_combined
        '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
        '"uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"referer":"$http_referer","ua":"$http_user_agent","duration":$request_time}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log  warn;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;             # Hide nginx version

    # Shared TLS config (used by all server blocks below)
    ssl_certificate     /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Shared security headers
    add_header X-Frame-Options           SAMEORIGIN                    always;
    add_header X-Content-Type-Options    nosniff                       always;
    add_header X-XSS-Protection          "1; mode=block"               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── :443 — Streamlit Dashboards (main user entry point) ─────────────────
    server {
        listen 443 ssl;
        server_name _;

        # Health check endpoint (used by Docker healthcheck + monitoring)
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        location / {
            proxy_pass         http://streamlit:8501;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support — required for Streamlit live updates
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── :3443 — Dagster UI (engineering access, BasicAuth protected) ─────────
    server {
        listen 3443 ssl;
        server_name _;

        # BasicAuth — prevents accidental exposure of pipeline controls
        auth_basic           "Dagster — Sales Analytics Platform";
        auth_basic_user_file /etc/nginx/.htpasswd;

        location / {
            proxy_pass         http://dagster-webserver:3000;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # WebSocket support — required for Dagster live run logs
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ── :8443 — Apache Superset (BI users, protected by Superset's own auth) ─
    server {
        listen 8443 ssl;
        server_name _;

        # Large client body for potential chart export
        client_max_body_size 100M;

        # Health check
        location /health {
            access_log off;
            proxy_pass http://superset:8088/health;
        }

        location / {
            proxy_pass         http://superset:8088;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Required for Superset's CSRF protection behind a proxy
            proxy_set_header   X-CSRFToken $http_x_csrftoken;
        }
    }
}
