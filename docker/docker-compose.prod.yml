# ─────────────────────────────────────────────────────────────────────────────
# Sales Analytics Platform — Production Docker Compose Stack
#
# Usage:
#   docker compose --env-file ../.env.prod -f docker-compose.prod.yml up -d
#
# First run: follow PRODUCTION_DEPLOYMENT_PLAN.md §Appendix B (Cold Start)
#
# Services:
#   postgres         → Dagster run storage + Superset metadata
#   redis            → Superset Celery broker / cache
#   dagster-daemon   → Schedules, sensors, run queue (no exposed port)
#   dagster-webserver→ Dagster UI (internal :3000)
#   streamlit        → Operational dashboards (internal :8501)
#   superset         → Enterprise BI — reports, RBAC (internal :8088)
#   superset-worker  → Celery async query worker
#   nginx            → TLS termination + reverse proxy (public :80 :443 :3443 :8443)
# ─────────────────────────────────────────────────────────────────────────────

version: '3.9'

# ── Reusable app service template (DRY via YAML anchors) ──────────────────────
x-app-defaults: &app-defaults
  build:
    context: ..
    dockerfile: docker/Dockerfile.app
    args:
      BUILD_DATE: ${BUILD_DATE:-unknown}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  env_file: ../.env.prod
  volumes:
    - ${DATA_ROOT:-/opt/sap/data}:/app/data      # Bind-mount: all DuckLake parquet + serving DBs
    - sqlmesh_state:/sqlmesh-state                # Named: SQLMesh state DB
    - dagster_home:/dagster-home                  # Named: Dagster home + log artifacts
  networks:
    - sap-net
  depends_on:
    postgres:
      condition: service_healthy
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "10"

services:
  # ─────────────── INFRASTRUCTURE ────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sap-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sap_meta            # default DB; dagster + superset DBs created by init.sql
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d sap_meta"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - sap-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: sap-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - sap-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─────────────── DAGSTER ───────────────────────────────────────────────────

  dagster-daemon:
    <<: *app-defaults
    container_name: sap-dagster-daemon
    command: dagster-daemon run
    # Daemon needs read-write access to data (ingestion, transformation, serving sync)
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_POSTGRES_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster"
      SQLMESH_ENV: prod
    healthcheck:
      test: ["CMD-SHELL", "dagster-daemon liveness-check || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  dagster-webserver:
    <<: *app-defaults
    container_name: sap-dagster-webserver
    command: >
      dagster-webserver
      --host 0.0.0.0
      --port 3000
      --dagster-home /dagster-home
    environment:
      DAGSTER_HOME: /dagster-home
      DAGSTER_POSTGRES_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/dagster"
    # Bind to localhost only — nginx proxies externally on :3443
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/server_info || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      dagster-daemon:
        condition: service_started
      postgres:
        condition: service_healthy

  # ─────────────── STREAMLIT ─────────────────────────────────────────────────

  streamlit:
    <<: *app-defaults
    container_name: sap-streamlit
    command: >
      streamlit run reporting/app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection true
      --browser.gatherUsageStats false
    environment:
      SQLMESH_ENV: prod
      DUCKDB_PATH: /app/data/warehouse/serving.db
    volumes:
      # Override the default app-defaults volume to make data read-only for Streamlit
      - ${DATA_ROOT:-/opt/sap/data}:/app/data:ro
      - sqlmesh_state:/sqlmesh-state:ro
      - dagster_home:/dagster-home:ro
    # Bind to localhost only — nginx proxies externally on :443
    ports:
      - "127.0.0.1:8501:8501"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ─────────────── APACHE SUPERSET ───────────────────────────────────────────

  superset:
    image: apache/superset:4.1.1
    container_name: sap-superset
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ${DATA_ROOT:-/opt/sap/data}:/app/data:ro  # Read-only: Superset only reads serving.db
    # Bind to localhost only — nginx proxies externally on :8443
    ports:
      - "127.0.0.1:8088:8088"
    command: >
      /bin/sh -c "
        superset db upgrade &&
        superset fab create-admin
          --username $${SUPERSET_ADMIN_USERNAME}
          --firstname Admin --lastname Admin
          --email $${SUPERSET_ADMIN_EMAIL}
          --password $${SUPERSET_ADMIN_PASSWORD}
          2>/dev/null || true &&
        superset init &&
        gunicorn
          --bind 0.0.0.0:8088
          --workers 4
          --worker-class gthread
          --threads 2
          --timeout 120
          --keep-alive 5
          --access-logfile -
          --error-logfile -
          'superset.app:create_app()'
      "
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s    # Superset db upgrade can be slow on first run
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sap-net
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  superset-worker:
    image: apache/superset:4.1.1
    container_name: sap-superset-worker
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/superset"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      PYTHONPATH: /app/pythonpath
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - ${DATA_ROOT:-/opt/sap/data}:/app/data:ro
    command: >
      celery
      --app=superset.tasks.celery_app:app
      worker
      --loglevel=INFO
      --pool=gevent
      --concurrency=4
      --max-tasks-per-child=1000
    depends_on:
      superset:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sap-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─────────────── NGINX (TLS termination + reverse proxy) ──────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: sap-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro          # mkcert or Let's Encrypt certs
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro  # BasicAuth for Dagster UI
    ports:
      - "80:80"      # HTTP → HTTPS redirect
      - "443:443"    # Streamlit (main reports, all users)
      - "3443:3443"  # Dagster UI (engineers only, BasicAuth)
      - "8443:8443"  # Apache Superset (BI users, Superset Auth)
    depends_on:
      - dagster-webserver
      - streamlit
      - superset
    restart: unless-stopped
    networks:
      - sap-net
    healthcheck:
      test: ["CMD-SHELL", "curl -skf https://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# ─────────────── VOLUMES ───────────────────────────────────────────────────────

volumes:
  postgres_data:
    name: sap_postgres_data    # Dagster run history + Superset metadata
  redis_data:
    name: sap_redis_data       # Redis AOF persistence
  dagster_home:
    name: sap_dagster_home     # Dagster instance config + run artifacts
  sqlmesh_state:
    name: sap_sqlmesh_state    # sqlmesh_state.db — do NOT let this be lost

# ─────────────── NETWORKS ──────────────────────────────────────────────────────

networks:
  sap-net:
    name: sap-network
    driver: bridge
    # No ipv6, no special options needed for local-first deployment
    # For hybrid: consider overlay network when adding cloud nodes
