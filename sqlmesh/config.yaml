# Sales Analytics - Practical Configuration
gateways:
  local_gateway:
    connection:
      type: duckdb
      
      # DuckLake catalog configuration
      catalogs:
        sales_lakehouse:
          type: ducklake
          path: {{ env_var('DUCKLAKE_CATALOG_PATH') }}
          data_path: {{ env_var('PARQUET_PATH') }}

      
      # Install DuckLake extension
      extensions:
        - ducklake
    
    # SQLMesh state management
    state_connection:
      type: duckdb
      database: {{ env_var('SQLMESH_STATE_PATH') }}

# Default gateway
default_gateway: local_gateway

# Model defaults
model_defaults:
  dialect: duckdb
  start: 2024-10-01
  cron: "@daily"
  
# Plan behavior
plan:
  auto_apply: false
  include_unmodified: false